name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["api/**", ".github/workflows/deploy-api.yml"]

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrcpsy300ultron4827
  RESOURCE_GROUP: cpsy300-ultron
  CONTAINERAPP: ca-cpsy300-ultron

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr login --name $ACR_NAME
          docker build -t $ACR_NAME.azurecr.io/recipes:${{ github.sha }} .
          docker push $ACR_NAME.azurecr.io/recipes:${{ github.sha }}

      - name: Deploy to container app
        run: |
          ACR_PWD=$(az acr credential show --name $ACR_NAME --query "passwords[0].value" -o tsv)

          az containerapp delete \
            --name $CONTAINERAPP \
            --resource-group $RESOURCE_GROUP \
            --yes

          az containerapp create \
            --name $CONTAINERAPP \
            --resource-group $RESOURCE_GROUP \
            --environment cae-cpsy300-ultron-wp \
            --image $ACR_NAME.azurecr.io/recipes:${{ github.sha }} \
            --target-port 3000 \
            --ingress external \
            --registry-server $ACR_NAME.azurecr.io \
            --registry-username $ACR_NAME \
            --registry-password "$ACR_PWD" \
            --system-assigned \
            --env-vars \
              DASHBOARD_TITLE="Ultron Recipes v2" \
              API_BASE_URL="https://fn-recipes-ultron-dmgnbbdddpawdkcr.mexicocentral-01.azurewebsites.net" \
              SERVICEBUS_NAMESPACE="sb-recipes-ultron.servicebus.windows.net" \
            --min-replicas 0

      - name: Re-grant Service Bus sender role
        run: |
          SB_ID=$(az servicebus namespace show -g $RESOURCE_GROUP -n sb-recipes-ultron --query id -o tsv)
          NEW_ID=$(az containerapp identity show --name $CONTAINERAPP --resource-group $RESOURCE_GROUP --query principalId -o tsv)

          for ID in $(az role assignment list --scope $SB_ID --role "Azure Service Bus Data Sender" --query "[].id" -o tsv); do
            az role assignment delete --ids $ID
          done

          az role assignment create --assignee-object-id $NEW_ID --assignee-principal-type ServicePrincipal --role "Azure Service Bus Data Sender" --scope $SB_ID
