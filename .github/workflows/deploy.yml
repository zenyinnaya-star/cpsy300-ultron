name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["api/**", ".github/workflows/deploy-api.yml"]

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrcpsy300ultron4827
  RESOURCE_GROUP: cpsy300-ultron
  CONTAINERAPP: ca-cpsy300-ultron

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr login --name $ACR_NAME
          docker build -t $ACR_NAME.azurecr.io/recipes:${{ github.sha }} .
          docker push $ACR_NAME.azurecr.io/recipes:${{ github.sha }}

      - name: Deploy to container app
        env:
          ENVIRONMENT: cae-cpsy300-ultron-wp
        run: |
          ACR_PWD=$(az acr credential show --name $ACR_NAME --query "passwords[0].value" -o tsv)

          az containerapp delete \
            --name $CONTAINERAPP \
            --resource-group $RESOURCE_GROUP \
            --yes

          az containerapp create \
            --name $CONTAINERAPP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/recipes:${{ github.sha }}

